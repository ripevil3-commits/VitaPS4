name: Import Vita3K PS4 source into VitaPS4

on:
  workflow_dispatch:
  push:
    branches:
      - ps4-port-bootstrap-2026-10-21
    paths:
      - .github/workflows/import-vita3k-source.yml

permissions:
  contents: write

concurrency:
  group: import-vita3k-ps4-source
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out VitaPS4 destination
        uses: actions/checkout@v4
        with:
          ref: ps4-port-bootstrap-2026-10-21
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch the complete Vita3K PS4 working branch
        run: |
          git clone --depth 1 --branch ps4-port-prototype-2026-10-21 https://github.com/ripevil3-commits/Vita3K.git /tmp/vita3k-source
          test -f /tmp/vita3k-source/CMakeLists.txt
          test -f /tmp/vita3k-source/vita3k/ps4/main_ps4.cpp
          if [ -f /tmp/vita3k-source/.gitmodules ]; then
            git -C /tmp/vita3k-source submodule update --init --recursive
          fi

      - name: Copy source files into this repository
        run: |
          # Keep the destination repository's Actions workflows. This token can write
          # repository contents, but GitHub blocks it from pushing new workflow files.
          rsync -a --exclude='.git' --exclude='.github/workflows/' /tmp/vita3k-source/ ./
          git status --short

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import complete Vita3K PS4 prototype source"
          git push origin HEAD:ps4-port-bootstrap-2026-10-21
