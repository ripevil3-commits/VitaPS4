name: Build native PS4 test apps

on:
  workflow_dispatch:
  push:
    branches:
      - ps4-port-bootstrap-2026-10-21
    paths:
      - "scripts/build-smoke.sh"
      - "scripts/build-shell.sh"
      - "scripts/build-ps4-app.sh"
      - "scripts/check-openorbis-env.sh"
      - "tests/smoke/**"
      - "tests/shell/**"
      - ".github/workflows/build-smoke-package.yml"

permissions:
  contents: read

jobs:
  build-native-apps:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      DOTNET_ROLL_FORWARD: Major
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld curl

      - name: Install .NET runtime for OpenOrbis packaging tools
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download OpenOrbis v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/toolchain-llvm-18.tar.gz"
          root="$RUNNER_TEMP/openorbis"
          mkdir -p "$root"
          curl --fail --location --retry 3 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$root"
          link_script="$(find "$root" -type f -name link.x -print -quit)"
          if [[ -z "$link_script" ]]; then
            echo "OpenOrbis archive did not contain link.x" >&2
            exit 1
          fi
          sdk_root="$(dirname "$link_script")"
          echo "OO_PS4_TOOLCHAIN=$sdk_root" >> "$GITHUB_ENV"
          echo "OpenOrbis root: $sdk_root"
          test -x "$sdk_root/bin/linux/create-fself"
          test -x "$sdk_root/bin/linux/create-gp4"
          test -x "$sdk_root/bin/linux/PkgTool.Core"

      - name: Check smoke prerequisites
        run: bash scripts/check-openorbis-env.sh

      - name: Build smoke test package
        run: bash scripts/build-smoke.sh

      - name: Check SDL2 shell prerequisites
        run: VITAPS4_APP=shell bash scripts/check-openorbis-env.sh

      - name: Build SDL2 native shell package
        run: bash scripts/build-shell.sh

      - name: Verify packages were created
        run: |
          set -euo pipefail
          test -s out/VitaPS4-SMOKE-v00.01.pkg
          test -s out/VitaPS4-SHELL-v00.01.pkg
          echo "Both native PS4 test PKGs were created. Neither package contains the Vita3K emulator core."
